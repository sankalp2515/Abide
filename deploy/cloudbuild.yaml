# IntentSeal Delegate on Cloud Run: built by Cloud Build (nothing heavy runs on your machine), pushed to Artifact
# Registry, deployed as one Cloud Run service (gateway + Console + live demo). See docs/DEPLOY_CLOUD_RUN.md.
#
#   gcloud builds submit --project <project> --config deploy/cloudbuild.yaml \
#     --substitutions=_REGION=asia-southeast1,_PUBLIC_KEY=<the Console's read-only key>,_SA=<runtime service account>
#
# Google services: Gemini on Vertex AI (cards, receipts, live agents) and Model Armor, with the service's own
# identity (no API key). Secrets (Secret Manager, created once by scripts/deploy_cloud_run.ps1):
#   intentseal-api-keys         INTENTSEAL_API_KEYS, e.g. "employee:<key>:project,reviewer:<key>:admin"
#   intentseal-delegate-secret  INTENTSEAL_DELEGATE_SECRET (signs handoff seals; generated by the script)
substitutions:
  _REGION: asia-southeast1
  _SERVICE: intentseal-delegate
  _REPO: intentseal
  _PUBLIC_KEY: change-me-public
  _SA: ""
  _ARMOR_LOCATION: us-central1
  _ARMOR_TEMPLATE: intentseal-delegate
  _TRIAL_KEYS: "1"
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID}
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID}",
           "--build-arg", "VITE_API_KEY=${_PUBLIC_KEY}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID}"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --project=${PROJECT_ID}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID}
      - --region=${_REGION}
      - --service-account=${_SA}
      - --allow-unauthenticated          # the Console is public read-only; every write needs an API key
      - --memory=2Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=1                # the demo keeps live sandboxes in memory: one instance
      - --port=8000
      - --set-env-vars=^@^INTENTSEAL_PUBLIC_KEY=${_PUBLIC_KEY}@INTENTSEAL_INVESTIGATOR_AUTO=0@GOOGLE_CLOUD_PROJECT=${PROJECT_ID}@GOOGLE_CLOUD_LOCATION=global@GOOGLE_CLOUD_QUOTA_PROJECT=${PROJECT_ID}@INTENTSEAL_MODEL_ARMOR_TEMPLATE=projects/${PROJECT_ID}/locations/${_ARMOR_LOCATION}/templates/${_ARMOR_TEMPLATE}@INTENTSEAL_TRIAL_KEYS=${_TRIAL_KEYS}@INTENTSEAL_TRUSTED_PROXIES=*
      - --set-secrets=INTENTSEAL_API_KEYS=intentseal-api-keys:latest,INTENTSEAL_DELEGATE_SECRET=intentseal-delegate-secret:latest
timeout: 3600s
options:
  machineType: E2_HIGHCPU_8
