# IntentSeal Delegate on Cloud Run: built by Cloud Build (nothing heavy runs on your machine), pushed to Artifact
# Registry, deployed as one Cloud Run service (gateway + Console + live demo). See docs/delegate/DEPLOY_CLOUD_RUN.md.
#
#   gcloud builds submit --config deploy/cloudbuild.yaml \
#     --substitutions=_REGION=asia-southeast1,_PUBLIC_KEY=<the Console's read-only key>
#
# Secrets (Secret Manager, created once by scripts/deploy_cloud_run.ps1):
#   intentseal-api-keys    INTENTSEAL_API_KEYS, e.g. "employee:<key>:project,reviewer:<key>:admin"
#   intentseal-gemini-key  GEMINI_API_KEY (Gemini API key), unless _USE_VERTEX=true
#   intentseal-delegate-secret  INTENTSEAL_DELEGATE_SECRET (signs handoff seals; generated by the script)
substitutions:
  _REGION: asia-southeast1
  _SERVICE: intentseal-delegate
  _REPO: intentseal
  _PUBLIC_KEY: change-me-public
  _USE_VERTEX: "false"
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID}
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID}",
           "--build-arg", "VITE_API_KEY=${_PUBLIC_KEY}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID}"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID}
      - --region=${_REGION}
      - --allow-unauthenticated          # the Console is public read-only; every write needs an API key
      - --memory=2Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=1                # the demo keeps live sandboxes in memory: one instance
      - --port=8000
      - --set-env-vars=INTENTSEAL_PUBLIC_KEY=${_PUBLIC_KEY},INTENTSEAL_INVESTIGATOR_AUTO=0,GOOGLE_GENAI_USE_VERTEXAI=${_USE_VERTEX},GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=global
      - --set-secrets=INTENTSEAL_API_KEYS=intentseal-api-keys:latest,GEMINI_API_KEY=intentseal-gemini-key:latest,INTENTSEAL_DELEGATE_SECRET=intentseal-delegate-secret:latest
timeout: 3600s
options:
  machineType: E2_HIGHCPU_8
