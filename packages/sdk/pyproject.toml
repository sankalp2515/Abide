[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "intentseal"
version = "0.1.0"
description = "IntentSeal: a prompt-injection firewall for AI agents. Inspect what your agent reads, check what it does."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sankalp Wanjari", email = "sankalpwanjari85@gmail.com" }]
keywords = ["prompt injection", "llm security", "ai agents", "guardrails", "firewall", "rag", "langchain"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Remote mode (a shared IntentSeal gateway) needs only this. The publish workflow keeps the two versions equal.
dependencies = ["intentseal-core==0.1.0", "httpx>=0.27"]

[project.optional-dependencies]
embedded = ["intentseal-core[engine,classifiers,ocr]==0.1.0"]   # run the engine in-process
langchain = ["langchain-core>=0.3"]

[project.urls]
Homepage = "https://github.com/sankalp2515/intentseal"
Source = "https://github.com/sankalp2515/intentseal"
Documentation = "https://github.com/sankalp2515/intentseal/blob/main/docs/INTEGRATION.md"
Issues = "https://github.com/sankalp2515/intentseal/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["intentseal*"]
exclude = ["intentseal_core*"]
