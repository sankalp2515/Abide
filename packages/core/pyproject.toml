[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "intentseal-core"
version = "0.1.0"
description = "IntentSeal Core Engine: prompt-injection firewall and action guard for LLM agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sankalp Wanjari", email = "sankalpwanjari85@gmail.com" }]
keywords = ["prompt injection", "llm security", "ai agents", "guardrails", "firewall", "rag"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The light install is what the SDK needs to talk to a gateway (remote mode); `engine` runs inspection in-process.
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "anyascii>=0.3",
]

[project.optional-dependencies]
# extraction (CORE-2), normalisation (CORE-3), outbound secret scan (CORE-9), library-first (D-016)
engine = [
  "beautifulsoup4>=4.12",
  "pypdf>=4",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "ftfy>=6.1",
  "confusable-homoglyphs>=3.2",
  "detect-secrets>=1.4",
]
classifiers = ["onnxruntime>=1.17", "tokenizers>=0.15", "huggingface_hub>=0.23", "numpy>=1.26"]
ocr = ["rapidocr-onnxruntime>=1.3", "pillow>=10"]
postgres = ["psycopg[binary]>=3.2"]
anthropic = ["anthropic>=1.12"]
all = ["intentseal-core[engine,classifiers,ocr]"]

[project.urls]
Homepage = "https://github.com/sankalp2515/intentseal"
Source = "https://github.com/sankalp2515/intentseal"
Documentation = "https://github.com/sankalp2515/intentseal/blob/main/docs/INTEGRATION.md"
Issues = "https://github.com/sankalp2515/intentseal/issues"

[project.scripts]
intentseal = "intentseal_core.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["intentseal_core*"]

[tool.setuptools.package-data]
intentseal_core = ["defaults/*.yaml", "defaults/policy-templates/*.yaml"]
