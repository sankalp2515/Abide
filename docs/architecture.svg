<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>IntentSeal Delegate architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4b5563"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#111827">IntentSeal Delegate</text>
  <text x="40" y="68" font-size="14" fill="#4b5563">The employee's words become the permission. Every tool call is checked against them. Every step leaves a chained receipt.</text>

  <!-- employee -->
  <rect x="40" y="110" width="190" height="96" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="135" y="140" font-size="15" font-weight="700" text-anchor="middle" fill="#312e81">Employee</text>
  <text x="135" y="162" font-size="12" text-anchor="middle" fill="#3730a3">“Read the quote, draft a</text>
  <text x="135" y="178" font-size="12" text-anchor="middle" fill="#3730a3">reply. Don't send it yet.”</text>
  <text x="135" y="196" font-size="11" text-anchor="middle" fill="#4b5563">Console · /#/delegate</text>

  <!-- gateway box -->
  <rect x="280" y="96" width="600" height="428" rx="14" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="6 4"/>
  <text x="300" y="122" font-size="13" font-weight="700" fill="#374151">Gateway container (FastAPI · one image · Cloud Run ready)</text>

  <rect x="300" y="138" width="270" height="78" rx="10" fill="#fff" stroke="#6366f1"/>
  <text x="315" y="162" font-size="14" font-weight="700" fill="#111827">① Contract compiler</text>
  <text x="315" y="182" font-size="12" fill="#374151">Gemini drafts clauses with quotes;</text>
  <text x="315" y="198" font-size="12" fill="#374151">word rules fill gaps or stand in</text>

  <rect x="590" y="138" width="270" height="78" rx="10" fill="#fff" stroke="#6366f1"/>
  <text x="605" y="162" font-size="14" font-weight="700" fill="#111827">② Grounding validator</text>
  <text x="605" y="182" font-size="12" fill="#374151">Quote must be the employee's words;</text>
  <text x="605" y="198" font-size="12" fill="#374151">names resolve from the trusted directory</text>

  <rect x="300" y="236" width="270" height="78" rx="10" fill="#fff" stroke="#059669"/>
  <text x="315" y="260" font-size="14" font-weight="700" fill="#111827">③ Permission card</text>
  <text x="315" y="280" font-size="12" fill="#374151">Hash-chained versions; confirm once</text>
  <text x="315" y="296" font-size="12" fill="#374151">with the card's hash (owner only)</text>

  <rect x="590" y="236" width="270" height="78" rx="10" fill="#fff" stroke="#d97706"/>
  <text x="605" y="260" font-size="14" font-weight="700" fill="#111827">④ Content filter</text>
  <text x="605" y="280" font-size="12" fill="#374151">IntentSeal engine: rules + classifier;</text>
  <text x="605" y="296" font-size="12" fill="#374151">hidden text removed, taint tracked</text>

  <rect x="300" y="334" width="270" height="78" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/>
  <text x="315" y="358" font-size="14" font-weight="700" fill="#111827">⑤ Action gate</text>
  <text x="315" y="378" font-size="12" fill="#374151">Recipient, record, amount, fields vs card;</text>
  <text x="315" y="394" font-size="12" fill="#374151">traced to a document → stop, no question</text>

  <rect x="590" y="334" width="270" height="78" rx="10" fill="#fff" stroke="#6366f1"/>
  <text x="605" y="358" font-size="14" font-weight="700" fill="#111827">⑥ Bound approval</text>
  <text x="605" y="378" font-size="12" fill="#374151">One question for one exact action;</text>
  <text x="605" y="394" font-size="12" fill="#374151">single use, expires in 15 minutes</text>

  <rect x="300" y="446" width="560" height="62" rx="10" fill="#fff" stroke="#059669"/>
  <text x="315" y="468" font-size="14" font-weight="700" fill="#111827">⑦ Work receipt</text>
  <text x="315" y="486" font-size="12" fill="#374151">Numbered, hash-chained receipts; Gemini writes the report and every sentence must cite them</text>
  <text x="315" y="501" font-size="12" fill="#374151">— a sentence the receipts do not support is dropped.</text>

  <!-- agents -->
  <rect x="930" y="110" width="230" height="150" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="1045" y="138" font-size="15" font-weight="700" text-anchor="middle" fill="#065f46">AI agent team</text>
  <text x="1045" y="160" font-size="12" text-anchor="middle" fill="#065f46">Google ADK + Gemini</text>
  <text x="1045" y="182" font-size="12" text-anchor="middle" fill="#374151">before_tool_callback → ⑤</text>
  <text x="1045" y="200" font-size="12" text-anchor="middle" fill="#374151">after_tool_callback → ④</text>
  <text x="1045" y="222" font-size="12" text-anchor="middle" fill="#374151">sealed handoffs (HMAC)</text>
  <text x="1045" y="244" font-size="11" text-anchor="middle" fill="#4b5563">or any framework via REST</text>

  <rect x="930" y="300" width="230" height="112" rx="10" fill="#fff7ed" stroke="#d97706"/>
  <text x="1045" y="328" font-size="15" font-weight="700" text-anchor="middle" fill="#9a3412">Business tools</text>
  <text x="1045" y="350" font-size="12" text-anchor="middle" fill="#374151">mail · drive · orders · refunds</text>
  <text x="1045" y="372" font-size="12" text-anchor="middle" fill="#b91c1c">Only allowed calls run;</text>
  <text x="1045" y="390" font-size="12" text-anchor="middle" fill="#374151">what they return is filtered</text>

  <!-- storage -->
  <rect x="300" y="548" width="270" height="66" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="435" y="574" font-size="14" font-weight="700" text-anchor="middle" fill="#1e3a8a">PostgreSQL</text>
  <text x="435" y="594" font-size="12" text-anchor="middle" fill="#374151">cards · receipts · approvals · decisions</text>

  <rect x="590" y="548" width="270" height="66" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="725" y="574" font-size="14" font-weight="700" text-anchor="middle" fill="#1e3a8a">Gemini</text>
  <text x="725" y="594" font-size="12" text-anchor="middle" fill="#374151">AI Studio key or Vertex AI</text>

  <rect x="40" y="300" width="190" height="112" rx="10" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="135" y="328" font-size="15" font-weight="700" text-anchor="middle" fill="#111827">Policy file</text>
  <text x="135" y="350" font-size="12" text-anchor="middle" fill="#374151">tools · contacts · records</text>
  <text x="135" y="368" font-size="12" text-anchor="middle" fill="#374151">business verbs · limits</text>
  <text x="135" y="386" font-size="12" text-anchor="middle" fill="#374151">company rules</text>
  <text x="135" y="404" font-size="11" text-anchor="middle" fill="#4b5563">policies/delegate/*.yaml</text>

  <!-- arrows -->
  <path d="M230 158H296" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M570 177H586" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M725 216V226H435V232" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M296 275H210V210" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="214" y="262" font-size="11" fill="#4b5563" text-anchor="end">confirm once</text>
  <path d="M435 314V330" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M926 240H895V424H520V416" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="700" y="438" font-size="11" fill="#4b5563">every tool call is checked</text>
  <path d="M926 306H864" stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M570 373H586" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M435 412V418M435 430V442" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M435 508V544" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M725 508V544" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M230 356H296" stroke="#6b7280" stroke-width="2" fill="none" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <path d="M860 380H926" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#r)"/>
</svg>
